<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1D1D20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ImageModel</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <!-- OpenCV.js for perspective transformation -->
  <script async src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript"></script>
</head>
<body>
  <div id="app">

    <!-- File bar - Top Left Bar -->
    <aside id="left-bar">
      <div class="bar-container">
        <button id="btn-import" class="icon-btn" title="Import Image">
          <span class="material-symbols-outlined">add_photo_alternate</span>
        </button>
        <button id="btn-export" class="icon-btn" disabled title="Export OBJ">
          <span class="material-symbols-outlined">drive_folder_upload</span>
        </button>
        <button id="btn-history" class="icon-btn" title="History">
          <span class="material-symbols-outlined">photo_prints</span>
        </button>
      </div>

      <!-- Recent Images Panel -->
      <div id="recent-panel" class="bar-container" style="display: none;">
        <div id="recent-images">
          <!-- Thumbnails will be added here -->
        </div>
      </div>
    </aside>


    <!-- Action Bar (Bottom Left) -->
    <aside id="action-bar">
       <div class="bar-container">
          <!-- Skip button (shown during perspective mode) -->
          <button id="btn-skip" class="icon-btn skip-btn" style="display: none;" title="Skip [ESC]">
            <span class="material-symbols-outlined">step_over</span>
          </button>
          <!-- Enter/Confirm button -->
          <button id="btn-approve" class="icon-btn enter-btn" style="display: none;" title="Confirm [Space]">
            <span class="material-symbols-outlined">keyboard_return</span>
          </button>
          <button id="btn-undo" class="icon-btn" disabled title="Undo [Ctrl+Z]">
            <span class="material-symbols-outlined">undo</span>
          </button>
          <button id="btn-redo" class="icon-btn" disabled title="Redo [Ctrl+Shift+Z]">
            <span class="material-symbols-outlined">redo</span>
          </button>
      </div>
    </aside>

    <!-- Ratio Slider (shown during perspective mode) -->
    <div id="ratio-control" style="display: none;">
      <label for="ratio-slider">
        Ratio: <span id="ratio-value">1.00</span>x
      </label>
      <input type="range" id="ratio-slider" min="0.5" max="2.0" value="1.0" step="0.01">
    </div>

    
    <!-- Bottom Toolbar Toolbar -->
    <nav id="bottom-bar">
      <div class="bar-container horizontal">
        <div class="tool-group">
          <button id="btn-perspective" class="icon-btn" disabled title="Perspective [P]">
            <span class="material-symbols-outlined">activity_zone</span>
          </button>
          <button id="btn-cut" class="icon-btn" disabled title="Cut [C]">
            <span class="material-symbols-outlined">content_cut</span>
          </button>
          <button id="btn-extrude" class="icon-btn" disabled title="Extrude [E]">
            <span class="material-symbols-outlined">text_select_move_up</span>
          </button>
          <button id="btn-inset" class="icon-btn" disabled title="Inset [F]">
            <span class="material-symbols-outlined">select_all</span>
          </button>
        </div>
        <div class="tool-divider"></div>
        <button id="btn-select" class="icon-btn" disabled title="Select [S]">
          <span class="material-symbols-outlined">arrow_selector_tool</span>
        </button>
      </div>
    </nav>


    <!-- Top Right Bar -->
    <aside id="right-bar">
      <div class="bar-container">
        <button id="btn-camera-reset" class="icon-btn" title="Reset Camera">
          <span class="material-symbols-outlined">photo_camera</span>
        </button>
      </div>
      <div class="bar-divider-h"></div>
      <div class="bar-container">
        <button id="btn-grid" class="icon-btn" title="Toggle Grid">
          <span class="material-symbols-outlined">grid_4x4</span>
        </button>
        <button id="btn-snap" class="icon-btn" title="Snap to Grid">
          <span class="material-symbols-outlined">browse</span>
        </button>
        <button id="btn-shortcuts" class="icon-btn" title="Keyboard Shortcuts">
          <span class="material-symbols-outlined">keyboard</span>
        </button>
      </div>
    </aside>

    <!-- Alignment Panel (Split View - Left Side) -->
    <aside id="align-panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">Define Perspective</div>
          <div class="panel-subtitle">Tap corners to place points. Pinch/scroll to zoom, drag to pan.</div>
        </div>
        <div class="panel-actions">
          <button id="align-reset-view" class="panel-btn" title="Reset zoom/pan">
            <span class="material-symbols-outlined">fit_screen</span>
          </button>
          <button id="align-clear" class="panel-btn" title="Clear Points">
            <span class="material-symbols-outlined">restart_alt</span>
            Clear
          </button>
        </div>
      </div>
      <div class="panel-content">
        <canvas id="align-canvas"></canvas>
      </div>
      <div class="panel-footer">
        <div class="point-counter">Points: <span id="align-point-count">0</span>/4</div>
        <div class="ratio-control-inline">
          <label>Ratio: <span class="ratio-value" id="align-ratio-value">1.00</span>x</label>
          <input type="range" id="align-ratio-slider" min="0.5" max="2.0" value="1.0" step="0.01">
        </div>
        <div class="panel-actions">
          <button id="align-skip" class="panel-btn" title="Skip alignment">
            Skip
          </button>
          <button id="align-confirm" class="panel-btn primary" disabled title="Confirm alignment">
            
            Confirm
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main id="viewport">
      <canvas id="canvas"></canvas>

      <!-- Mode toolbar for cut tool (right side) -->
      <div id="mode-toolbar" style="display: none;">
        <div class="bar-container">
        <button id="mode-edge" class="mode-btn active" title="Edge mode - click on edges">
          <span class="material-symbols-outlined">border_horizontal</span>
        </button>
        <button id="mode-face" class="mode-btn" title="Face mode - click on faces">
          <span class="material-symbols-outlined">square</span>
        </button>
        </div>
      </div>

      <!-- Mode toolbar for inset tool (right side) -->
      <div id="inset-mode-toolbar" style="display: none;">
        <div class="bar-container"> 
          <button id="inset-mode-grouped" class="mode-btn active" title="Grouped - inset faces as region">
            <span class="material-symbols-outlined">stack_group</span>
          </button>
          <button id="inset-mode-individual" class="mode-btn" title="Individual - inset each face separately">
            <span class="material-symbols-outlined">view_column_2</span>
          </button>
        </div>
      </div>

      <!-- 2D Overlay for perspective lines (legacy - kept for compatibility) -->
      <canvas id="overlay" style="display: none;"></canvas>

      <!-- Instructions tooltip -->
      <div id="instructions" style="display: none;"></div>
    </main>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="file-input" accept="image/*" style="display: none;">

  <!-- Confirmation Modal -->
  <div id="confirm-modal" class="confirm-overlay" style="display: none;">
    <div class="confirm-modal">
      <div class="confirm-content">
        <div class="confirm-title">Start New Session?</div>
        <div class="confirm-message">Loading a new image will clear your current work. This cannot be undone.</div>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="confirm-btn">Cancel</button>
          <button id="confirm-ok" class="confirm-btn primary">Continue</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
